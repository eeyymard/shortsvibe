<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shorts Vibe Searcher (Pro)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 p-4 md:p-8 font-sans">
    <div class="max-w-5xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
            <h1 class="text-2xl font-bold text-rose-600">Shorts <span class="text-gray-900">Vibe</span> Searcher</h1>
            <div class="flex w-full md:w-auto gap-2">
                <input id="keyword" type="text" placeholder="Search Shorts..." 
                    class="flex-1 md:w-64 bg-white border border-gray-200 rounded-lg px-4 py-2 text-sm outline-none focus:ring-2 focus:ring-rose-500 shadow-sm">
                <button onclick="fetchShorts()" class="bg-rose-600 text-white px-6 py-2 rounded-lg font-semibold text-sm hover:bg-rose-700 shadow-md transition-all">
                    Search
                </button>
            </div>
        </header>

        <div id="status" class="hidden text-center text-gray-400 text-xs mb-4 uppercase tracking-widest">Fetching from Google...</div>

        <div class="hidden md:grid grid-cols-12 gap-4 px-4 py-2 text-xs font-bold text-gray-400 uppercase border-b border-gray-200">
            <div class="col-span-1">Preview</div>
            <div class="col-span-8">Video Title & Channel</div>
            <div class="col-span-3 text-right">Action</div>
        </div>

        <div id="videoList" class="divide-y divide-gray-100 bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <p class="p-8 text-center text-gray-400 italic">Enter a keyword to see the vibes.</p>
        </div>
    </div>

    <script>
        // PASTE YOUR API KEY HERE
        const API_KEY = 'AIzaSyCFhNY1E0zYsbftUg_qaTJatVC1TmIL7hk'; 

        async function fetchShorts() {
            const query = document.getElementById('keyword').value;
            if (!query) return;
            if (API_KEY === '') {
                alert("Please add your Google API Key to the code first!");
                return;
            }

            const list = document.getElementById('videoList');
            const status = document.getElementById('status');
            
            list.innerHTML = '';
            status.classList.remove('hidden');

            try {
                // We add '#shorts' and 'shorts' to the query + use 'videoDuration=short' (under 4 mins)
                const searchQuery = encodeURIComponent(query + " shorts");
                const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&q=${searchQuery}&type=video&videoDuration=short&maxResults=30&key=${API_KEY}`;

                const response = await fetch(url);
                const data = await response.json();
                
                status.classList.add('hidden');

                if (!data.items || data.items.length === 0) {
                    list.innerHTML = '<p class="p-8 text-center text-gray-400">No Shorts found.</p>';
                    return;
                }

                data.items.forEach(item => {
                    const id = item.id.videoId;
                    const title = item.snippet.title;
                    const channel = item.snippet.channelTitle;
                    const thumb = item.snippet.thumbnails.default.url; // Small thumbnail
                    const shortLink = `https://www.youtube.com/shorts/${id}`;

                    list.innerHTML += `
                        <div class="grid grid-cols-4 md:grid-cols-12 gap-4 items-center p-3 hover:bg-rose-50 transition-colors group">
                            <div class="col-span-1">
                                <img src="${thumb}" class="w-12 h-12 rounded-lg object-cover border border-gray-100">
                            </div>
                            
                            <div class="col-span-2 md:col-span-8">
                                <h3 class="text-sm font-medium text-gray-800 line-clamp-1 group-hover:text-rose-600 transition-colors">${title}</h3>
                                <p class="text-xs text-gray-400">@${channel}</p>
                            </div>

                            <div class="col-span-1 md:col-span-3 text-right">
                                <a href="${shortLink}" target="_blank" class="inline-flex items-center text-xs font-bold text-rose-600 hover:underline">
                                    OPEN <span class="ml-1">↗</span>
                                </a>
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                status.innerText = "Error: Check your API Key or connection.";
                console.error(error);
            }
        }
    </script>
</body>
</html>
