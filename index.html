<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shorts Vibe Searcher</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { transition: background-color 0.5s, color 0.5s; }
        .mode-transition { transition: all 0.4s ease-in-out; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        /* Tooltip Logic */
        .tooltip:hover .tooltip-text { visibility: visible; opacity: 1; transform: translateY(0); }
    </style>
</head>
<body id="mainBody" class="bg-gray-50 text-slate-900 font-sans pb-20">

    <div class="max-w-2xl mx-auto px-4 pt-8">
        <header class="text-center mb-6">
            <h1 id="appTitle" class="text-3xl font-extrabold text-rose-600 tracking-tight transition-colors">
                Shorts <span class="text-inherit">Vibe</span>
            </h1>
        </header>

        <div class="flex justify-center mb-8">
            <div class="bg-gray-200 p-1 rounded-2xl flex items-center cursor-pointer shadow-inner relative w-48 h-12" onclick="toggleMode()">
                <div id="toggleIndicator" class="absolute bg-white shadow-md rounded-xl w-[48%] h-10 left-1 mode-transition"></div>
                <div class="z-10 w-1/2 text-center text-xs font-bold tracking-widest text-gray-500" id="freeLabel">FREE</div>
                <div class="z-10 w-1/2 text-center text-xs font-bold tracking-widest text-gray-500" id="proLabel">PRO</div>
            </div>
        </div>

        <div id="apiBox" class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm mb-6 mode-transition opacity-50 grayscale pointer-events-none">
            <div class="flex items-center justify-between mb-2">
                <label class="text-[10px] font-bold uppercase tracking-widest text-gray-400 flex items-center gap-1">
                    YouTube API Key
                    <div class="relative tooltip cursor-help">
                        <span class="bg-gray-200 text-gray-600 w-4 h-4 rounded-full flex items-center justify-center text-[10px]">?</span>
                        <div class="tooltip-text invisible opacity-0 absolute left-0 bottom-6 w-64 p-4 bg-slate-800 text-white text-[11px] rounded-xl shadow-2xl transition-all z-50 leading-relaxed border border-white/10 transform translate-y-2">
                            <strong class="text-rose-400">Pro Setup Guide:</strong><br>
                            1. Go to <span class="underline">console.cloud.google.com</span><br>
                            2. Create a project & Enable <br>&nbsp;&nbsp;&nbsp;"YouTube Data API v3"<br>
                            3. Go to Credentials > Create API Key.<br>
                            <span class="text-emerald-400 font-bold mt-2 block italic">Safe & 100% Free for you!</span>
                        </div>
                    </div>
                </label>
                <span id="keyStatus" class="text-[10px] font-bold text-gray-300">NOT SET</span>
            </div>
            <input id="apiKeyInput" type="password" placeholder="Paste your key to unlock Pro..." 
                class="w-full bg-gray-50 border border-gray-100 rounded-xl px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-emerald-500 transition-all">
        </div>

        <div class="flex gap-2 mb-8">
            <input id="keyword" type="text" placeholder="Type a vibe..." 
                class="flex-1 bg-white border border-gray-200 rounded-2xl px-5 py-4 shadow-sm outline-none focus:ring-2 focus:ring-rose-500 transition-all font-medium">
            <button onclick="fetchShorts()" id="searchBtn" class="bg-rose-600 text-white px-6 py-4 rounded-2xl font-bold hover:bg-rose-700 active:scale-95 transition-all shadow-lg shadow-rose-100">
                🔍
            </button>
        </div>

        <div id="status" class="hidden text-center text-xs text-gray-400 mb-6 uppercase tracking-widest animate-pulse">Initializing...</div>
        
        <div id="videoList" class="space-y-3"></div>
    </div>

    <script>
        let currentMode = 'FREE';
        const freeInstances = [
            'https://iv.melmac.space',
            'https://invidious.flokinet.to',
            'https://inv.riverside.rocks',
            'https://iv.ggtyler.dev',
            'https://invidious.projectsegfau.lt'
        ];

        window.onload = () => {
            const savedKey = localStorage.getItem('shorts-vibe-key');
            if (savedKey) {
                document.getElementById('apiKeyInput').value = savedKey;
                updateKeyStatus(true);
            }
        };

        document.getElementById('apiKeyInput').addEventListener('input', (e) => {
            localStorage.setItem('shorts-vibe-key', e.target.value);
            updateKeyStatus(!!e.target.value);
        });

        function updateKeyStatus(isSet) {
            const status = document.getElementById('keyStatus');
            status.innerText = isSet ? "✅ SAVED" : "NOT SET";
            status.className = isSet ? "text-[10px] font-bold text-emerald-500" : "text-[10px] font-bold text-gray-300";
        }

        function toggleMode() {
            const body = document.getElementById('mainBody');
            const indicator = document.getElementById('toggleIndicator');
            const apiBox = document.getElementById('apiBox');
            const title = document.getElementById('appTitle');
            const searchBtn = document.getElementById('searchBtn');

            if (currentMode === 'FREE') {
                currentMode = 'PRO';
                indicator.style.left = '51%';
                body.className = "bg-slate-950 text-white font-sans pb-20";
                apiBox.className = "bg-slate-900 p-4 rounded-2xl border border-slate-800 shadow-sm mb-6 mode-transition opacity-100 grayscale-0 pointer-events-auto";
                title.className = "text-3xl font-extrabold text-emerald-500 tracking-tight transition-colors";
                searchBtn.className = "bg-emerald-600 text-white px-6 py-4 rounded-2xl font-bold hover:bg-emerald-700 active:scale-95 transition-all shadow-lg shadow-emerald-900/20";
            } else {
                currentMode = 'FREE';
                indicator.style.left = '4px';
                body.className = "bg-gray-50 text-slate-900 font-sans pb-20";
                apiBox.className = "bg-white p-4 rounded-2xl border border-gray-100 shadow-sm mb-6 mode-transition opacity-50 grayscale pointer-events-none";
                title.className = "text-3xl font-extrabold text-rose-600 tracking-tight transition-colors";
                searchBtn.className = "bg-rose-600 text-white px-6 py-4 rounded-2xl font-bold hover:bg-rose-700 active:scale-95 transition-all shadow-lg shadow-rose-100";
            }
        }

        async function fetchShorts() {
            const query = document.getElementById('keyword').value;
            const list = document.getElementById('videoList');
            const status = document.getElementById('status');
            if (!query) return;

            list.innerHTML = '';
            status.classList.remove('hidden');

            if (currentMode === 'PRO') {
                const key = document.getElementById('apiKeyInput').value;
                if (!key) { alert("PRO Mode requires an API Key!"); status.classList.add('hidden'); return; }
                status.innerText = "🚀 PRO ENGINE: Fetching Stats...";
                await fetchFromGoogle(query, key);
            } else {
                status.innerText = "☁️ FREE ENGINE: Fetching Vibes...";
                await fetchFromMirror(query);
            }
        }

        async function fetchFromGoogle(query, key) {
            try {
                // 1. Get Search Results
                const searchUrl = `https://www.googleapis.com/youtube/v3/search?part=id&q=${encodeURIComponent(query + " shorts")}&type=video&videoDuration=short&maxResults=20&key=${key}`;
                const searchRes = await fetch(searchUrl);
                const searchData = await searchRes.json();
                
                if (searchData.error) throw new Error(searchData.error.message);
                const ids = searchData.items.map(i => i.id.videoId).join(',');

                // 2. Get Stats for those IDs
                const statsUrl = `https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics&id=${ids}&key=${key}`;
                const statsRes = await fetch(statsUrl);
                const statsData = await statsRes.json();

                renderVideos(statsData.items.map(i => ({
                    id: i.id,
                    title: i.snippet.title,
                    channel: i.snippet.channelTitle,
                    thumb: i.snippet.thumbnails.medium.url,
                    views: i.statistics.viewCount,
                    likes: i.statistics.likeCount
                })));
            } catch (e) { document.getElementById('status').innerText = "Google API Error: " + e.message; }
        }

        async function fetchFromMirror(query) {
            for (let url of freeInstances) {
                try {
                    const response = await fetch(`${url}/api/v1/search?q=${encodeURIComponent(query + " shorts")}&type=video`);
                    const data = await response.json();
                    if (data && data.length > 0) {
                        renderVideos(data.slice(0, 20).map(i => ({
                            id: i.videoId,
                            title: i.title,
                            channel: i.author,
                            thumb: i.videoThumbnails[0].url,
                            views: i.viewCount,
                            likes: null // Mirrors rarely provide likes in search
                        })));
                        return;
                    }
                } catch (e) { console.warn(`Mirror ${url} down.`); }
            }
            document.getElementById('status').innerText = "All mirrors busy. Try PRO!";
        }

        function formatNum(num) {
            if (!num) return 'N/A';
            return new Intl.NumberFormat('en-US', { notation: 'compact', compactDisplay: 'short' }).format(num);
        }

        function renderVideos(videos) {
            const list = document.getElementById('videoList');
            document.getElementById('status').classList.add('hidden');
            videos.forEach(v => {
                const cardBg = currentMode === 'PRO' ? 'bg-slate-900 border-slate-800' : 'bg-white border-gray-100 shadow-sm';
                const textColor = currentMode === 'PRO' ? 'text-slate-100' : 'text-gray-800';
                const accent = currentMode === 'PRO' ? 'text-emerald-400' : 'text-rose-600';

                list.innerHTML += `
                    <a href="https://www.youtube.com/shorts/${v.id}" target="_blank" class="flex items-center gap-4 ${cardBg} p-3 rounded-2xl border hover:scale-[1.02] transition-all group">
                        <img src="${v.thumb}" class="w-20 h-20 rounded-xl object-cover flex-shrink-0 shadow-sm">
                        <div class="flex-1 min-w-0">
                            <h3 class="text-sm font-bold ${textColor} line-clamp-2 leading-tight group-hover:${accent}">${v.title}</h3>
                            <div class="flex items-center gap-3 mt-2">
                                <span class="text-[10px] font-medium text-gray-400 flex items-center gap-1 uppercase tracking-tighter">
                                    👁️ ${formatNum(v.views)}
                                </span>
                                ${v.likes ? `<span class="text-[10px] font-medium text-gray-400 flex items-center gap-1 uppercase tracking-tighter">
                                    👍 ${formatNum(v.likes)}
                                </span>` : ''}
                            </div>
                            <p class="text-[10px] text-gray-500 mt-1">@${v.channel}</p>
                        </div>
                    </a>
                `;
            });
        }
    </script>
</body>
</html>
