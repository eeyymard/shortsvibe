<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shorts Vibe Searcher</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Smooth fade-in for the video cards */
        .fade-in { animation: fadeIn 0.6s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 p-6 font-sans">
    <div class="max-w-5xl mx-auto">
        <header class="text-center mb-10">
            <h1 class="text-4xl font-extrabold mb-2 tracking-tight text-slate-900">
                Shorts <span class="text-rose-600">Vibe</span> Searcher
            </h1>
            <p class="text-slate-500 font-medium">Find your next favorite short-form video.</p>
        </header>
        
        <div class="flex flex-col md:flex-row gap-3 mb-12 max-w-2xl mx-auto">
            <input id="keyword" type="text" placeholder="Search for a vibe (e.g. Street Food, Gym, ASMR)..." 
                class="flex-1 bg-white border border-slate-200 rounded-2xl px-6 py-4 shadow-sm outline-none focus:ring-2 focus:ring-rose-500 focus:border-transparent transition-all">
            <button onclick="fetchShorts()" class="bg-rose-600 text-white px-8 py-4 rounded-2xl font-bold shadow-lg shadow-rose-200 hover:bg-rose-700 active:scale-95 transition-all">
                Search
            </button>
        </div>

        <div id="status" class="hidden text-center text-slate-400 mb-8 animate-pulse italic">
            Scanning for viral vibes...
        </div>

        <div id="videoGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
            </div>
    </div>

<script>
    // A list of different 'Public Kitchens' (Piped Instances)
    const instances = [
        'https://pipedapi.kavin.rocks',
        'https://api.piped.victr.me',
        'https://piped-api.garudalinux.org',
        'https://pipedapi.leptons.xyz'
    ];

    async function fetchShorts() {
        const query = document.getElementById('keyword').value;
        if (!query) return;

        const grid = document.getElementById('videoGrid');
        const status = document.getElementById('status');
        
        grid.innerHTML = '';
        status.classList.remove('hidden');
        status.innerText = "Connecting to a vibe server...";

        let success = false;

        // Loop through our backup servers until one works
        for (const baseUrl of instances) {
            try {
                console.log(`Trying server: ${baseUrl}`);
                const searchQuery = encodeURIComponent(query + " shorts");
                
                // We set a 'timeout' so if one server is slow, we move on quickly
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 5000); // 5 seconds limit

                const response = await fetch(`${baseUrl}/search?q=${searchQuery}&filter=videos`, { signal: controller.signal });
                clearTimeout(timeoutId);

                if (!response.ok) throw new Error(`Server busy (${response.status})`);

                const data = await response.json();
                
                if (data.items && data.items.length > 0) {
                    renderVideos(data.items.slice(0, 30));
                    success = true;
                    status.classList.add('hidden');
                    break; // Stop looking once we have results!
                }
            } catch (error) {
                console.warn(`Server ${baseUrl} failed. Trying next...`, error.message);
            }
        }

        if (!success) {
            status.innerText = "All vibe servers are busy. Please wait 60 seconds and try again!";
        }
    }

    function renderVideos(videos) {
        const grid = document.getElementById('videoGrid');
        videos.forEach((video, index) => {
            const videoId = video.url.split('v=')[1];
            // If the API format is different, we handle it
            const cleanId = videoId ? videoId.split('&')[0] : video.url.split('/').pop();
            const videoUrl = `https://www.youtube.com/shorts/${cleanId}`;
            
            grid.innerHTML += `
                <div class="fade-in bg-white rounded-3xl overflow-hidden border border-slate-100 shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-300" style="animation-delay: ${index * 0.05}s">
                    <a href="${videoUrl}" target="_blank" class="block">
                        <div class="relative aspect-[9/16] bg-slate-200">
                            <img src="${video.thumbnail}" class="w-full h-full object-cover" alt="thumbnail" onerror="this.src='https://placehold.co/400x600?text=No+Preview'">
                            <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent"></div>
                            <div class="absolute bottom-4 left-4 right-4">
                                <h3 class="text-white text-sm font-semibold line-clamp-2">${video.title}</h3>
                                <p class="text-white/70 text-xs mt-1">@${video.uploaderName}</p>
                            </div>
                        </div>
                    </a>
                </div>
            `;
        });
    }
</script>
    
</body>
</html>
